# .github/workflows/ci.yml
# verify pull requests and main-branch changes across supported surfaces

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check Prettier formatting
        run: node scripts/format-repository.ts --check --prettier-only

      - name: Check comment style
        run: |
          node scripts/check-js-comments.ts apps packages scripts tests oxlint-plugin-456code vite.config.ts
          python3 scripts/check_comment_style.py --check --headers apps packages scripts tests experiments .github .vite-hooks

      - name: Check directive preservation
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-directive-preservation.ts FETCH_HEAD

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

  cartographer:
    name: Cartographer (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # engine-floor lanes: cartographer-core advertises ^22.16 || ^23.11 || >=24.10,
      # so the bounded job runs the floor, the odd line, and the repo default
      matrix:
        node: ["22.16", "23.11", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true

      - name: Build Cartographer core
        run: vp run --filter @t3tools/cartographer-core build

      - name: Test Cartographer core
        working-directory: packages/cartographer-core
        run: vp test run

      - name: Run standalone acceptance
        working-directory: packages/cartographer-core
        run: |
          node scripts/standaloneAcceptance.mjs
          node scripts/proposalConcurrencyAcceptance.mjs
          node scripts/patchPerformanceAcceptance.mjs

      - name: Smoke-test the Cartographer MCP server
        run: node --experimental-strip-types scripts/smoke-cartographer-mcp.ts

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # new workspace packages with test scripts must be added explicitly; Cartographer stays in its bounded job
      - name: Test
        run: |
          vp run \
            --filter @t3tools/desktop \
            --filter @t3tools/mobile \
            --filter 456code \
            --filter @t3tools/web \
            --filter @t3tools/client-runtime \
            --filter @t3tools/contracts \
            --filter effect-acp \
            --filter effect-codex-app-server \
            --filter @t3tools/shared \
            --filter @t3tools/ssh \
            --filter @t3tools/tailscale \
            --filter @t3tools/oxlint-plugin-456code \
            --filter @t3tools/scripts \
            test

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  release_smoke_windows:
    name: Release Smoke (Windows package shims)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=456code...
              - --filter=@t3tools/cartographer-core...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Expose pnpm
        shell: pwsh
        run: |
          $pnpmVersion = node --print "require('./package.json').packageManager.split('@').pop()"
          $vpPnpmBin = Join-Path $env:USERPROFILE ".vite-plus/package_manager/pnpm/$pnpmVersion/pnpm/bin"
          $vpPnpmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $vpPnpmBin "pnpm.cmd") --version

      - name: Build CLI release graph
        run: vp run --filter 456code build

      - name: Exercise exact packed CLI through Windows shims
        run: node apps/server/scripts/cli.ts publish --dry-run --app-version 9.9.9-smoke.0 --verbose
