# .github/workflows/ci.yml
# verify pull requests and main-branch changes across supported surfaces

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Parse PowerShell acceptance script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/windows-desktop-acceptance.ps1").Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check Prettier formatting
        run: node scripts/format-repository.ts --check --prettier-only

      - name: Check comment style
        run: |
          node scripts/check-js-comments.ts apps packages scripts tests oxlint-plugin-456code vite.config.ts
          python3 scripts/check_comment_style.py --check --headers apps packages scripts tests experiments .github .vite-hooks

      - name: Check directive preservation
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/check-directive-preservation.ts FETCH_HEAD

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

  cartographer:
    name: Cartographer (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # engine-floor lanes: cartographer-core advertises ^22.16 || ^23.11 || >=24.10,
      # so the bounded job runs the floor, the odd line, and the repo default
      matrix:
        # prettier-ignore
        node: ["22.16", "23.11", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true

      - name: Build Cartographer core
        run: vp run --filter @t3tools/cartographer-core build

      - name: Test Cartographer core
        working-directory: packages/cartographer-core
        run: vp test run

      - name: Run standalone acceptance
        working-directory: packages/cartographer-core
        run: |
          node scripts/standaloneAcceptance.mjs
          node scripts/proposalConcurrencyAcceptance.mjs
          node scripts/patchPerformanceAcceptance.mjs

      - name: Smoke-test the Cartographer MCP server
        run: node --experimental-strip-types scripts/smoke-cartographer-mcp.ts

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # new workspace packages with test scripts must be added explicitly; Cartographer stays in its bounded job
      # the server suite runs in its own sharded job below because it disables file parallelism
      - name: Test
        run: |
          vp run \
            --filter @t3tools/desktop \
            --filter @t3tools/mobile \
            --filter @t3tools/web \
            --filter @t3tools/client-runtime \
            --filter @t3tools/contracts \
            --filter effect-acp \
            --filter effect-codex-app-server \
            --filter @t3tools/shared \
            --filter @t3tools/ssh \
            --filter @t3tools/tailscale \
            --filter @t3tools/oxlint-plugin-456code \
            --filter @t3tools/scripts \
            test

  test_server:
    name: Test server (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build Cartographer core
        run: vp run --filter @t3tools/cartographer-core build

      - name: Test server suite
        working-directory: apps/server
        run: vp test run --shard ${{ matrix.shard }}/3

  # The static analysis below needs a macOS runner, which bills far more than a
  # Linux minute, so gate it on the native sources it actually lints instead of
  # paying for it on every push. Detection is API-only (no checkout) and fails
  # open: if the diff cannot be resolved, the lint runs.
  mobile_native_changes:
    name: Mobile Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # one row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # the PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # the compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          # sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command
          pattern='^apps/mobile/.*\.swift$|^apps/mobile/(\.swiftlint\.yml|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: mobile_native_changes
    # skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  release_smoke_windows:
    name: Release Smoke (Windows package shims)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=456code...
              - --filter=@t3tools/cartographer-core...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Expose pnpm
        shell: pwsh
        run: |
          $pnpmVersion = node --print "require('./package.json').packageManager.split('@').pop()"
          $vpPnpmBin = Join-Path $env:USERPROFILE ".vite-plus/package_manager/pnpm/$pnpmVersion/pnpm/bin"
          $vpPnpmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $vpPnpmBin "pnpm.cmd") --version

      - name: Build CLI release graph
        run: vp run --filter 456code build

      - name: Exercise exact packed CLI through Windows shims
        run: node apps/server/scripts/cli.ts publish --dry-run --app-version 9.9.9-smoke.0 --verbose

  windows_wsl_node_pty:
    name: Windows acceptance WSL node-pty producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build Linux x64 node-pty for the packaged WSL tree
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && "$GITHUB_WORKSPACE/scripts/node_modules/.bin/node-gyp" rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload WSL prebuild
        uses: actions/upload-artifact@v7
        with:
          name: windows-acceptance-wsl-node-pty
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 3

  windows_desktop_package:
    name: Windows unsigned NSIS acceptance producer
    needs: [windows_wsl_node_pty]
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      acceptance_artifact_id: ${{ steps.upload_acceptance.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download WSL prebuild
        uses: actions/download-artifact@v8
        with:
          name: windows-acceptance-wsl-node-pty
          path: wsl-prebuild

      - name: Build exact N and N+1 unsigned installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          vp run dist:desktop:artifact `
            --platform win `
            --target nsis `
            --arch x64 `
            --build-version 0.0.17-nightly.20990101.1 `
            --output-dir windows-acceptance-artifacts/n `
            --mock-updates `
            --mock-update-server-port 41230 `
            --wsl-prebuild "$env:GITHUB_WORKSPACE/wsl-prebuild/pty.node" `
            --verbose
          vp run dist:desktop:artifact `
            --platform win `
            --target nsis `
            --arch x64 `
            --build-version 0.0.17-nightly.20990101.2 `
            --output-dir windows-acceptance-artifacts/n1 `
            --skip-build `
            --mock-updates `
            --mock-update-server-port 41230 `
            --wsl-prebuild "$env:GITHUB_WORKSPACE/wsl-prebuild/pty.node" `
            --verbose

      - name: Verify producer artifact contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($version in @("n", "n1")) {
            $root = "windows-acceptance-artifacts/$version"
            $installers = @(Get-ChildItem $root -Filter "*.exe" -File)
            $blockmaps = @(Get-ChildItem $root -Filter "*.exe.blockmap" -File)
            $manifests = @(
              Get-ChildItem $root -Filter "*.yml" -File |
                Where-Object { $_.Name -notlike "builder-*" }
            )
            if ($installers.Count -ne 1 -or $blockmaps.Count -ne 1 -or $manifests.Count -lt 1) {
              throw "Unexpected $version artifact set: installers=$($installers.Count), blockmaps=$($blockmaps.Count), manifests=$($manifests.Count)"
            }
          }

      - name: Upload exact unsigned acceptance artifacts
        id: upload_acceptance
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-nsis-acceptance
          path: windows-acceptance-artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  windows_desktop_acceptance:
    name: Windows installed artifact acceptance
    needs: [windows_desktop_package]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download exact unsigned installers
        uses: actions/download-artifact@v8
        with:
          name: windows-unsigned-nsis-acceptance
          path: windows-acceptance-artifacts

      - name: Exercise digest and stale-tree lifecycle on Windows
        run: >-
          vp test run
          tests/apps/desktop/wsl/DesktopWslServerTree.test.ts
          tests/apps/server/textGeneration/ClaudeTextGeneration.test.ts
          tests/scripts/build-desktop-artifact.test.ts

      - name: Exercise installed package and updater paths
        shell: pwsh
        timeout-minutes: 30
        run: >-
          ./scripts/windows-desktop-acceptance.ps1
          -ArtifactsRoot ./windows-acceptance-artifacts

      - name: Upload acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-acceptance-failure-evidence
          path: |
            ${{ runner.temp }}/456code-windows-acceptance/**/*.log
            ${{ runner.temp }}/456code-windows-acceptance/**/*.jsonl
            ${{ runner.temp }}/456code-windows-acceptance/**/*.ndjson
          if-no-files-found: ignore
          retention-days: 3

  windows_desktop_artifact_cleanup:
    name: Windows acceptance artifact cleanup
    needs: [windows_desktop_package, windows_desktop_acceptance]
    if: >-
      ${{
        always() &&
        needs.windows_desktop_package.outputs.acceptance_artifact_id != '' &&
        (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete exact acceptance artifact
        env:
          ACCEPTANCE_ARTIFACT_ID: ${{ needs.windows_desktop_package.outputs.acceptance_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          detail="$(
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$ACCEPTANCE_ARTIFACT_ID" 2>&1
          )"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "Deleted acceptance artifact $ACCEPTANCE_ARTIFACT_ID."
            exit 0
          fi
          if [[ "$detail" == *"HTTP 404"* ]]; then
            echo "Acceptance artifact $ACCEPTANCE_ARTIFACT_ID was already absent."
            exit 0
          fi
          if [[ "$detail" == *"HTTP 403"* ]]; then
            echo "::warning::Artifact deletion was not permitted; one-day retention remains the fallback."
            exit 0
          fi
          echo "$detail" >&2
          exit "$status"
