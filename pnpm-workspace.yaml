packages:
  - apps/*
  - oxlint-plugin-456code
  - packages/*
  - scripts
  - tests

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  node-pty: true
  sharp: true
  utf-8-validate: false
  workerd: false

catalog:
  "@clerk/clerk-js": 6.31.0
  "@clerk/expo": 4.6.5
  "@clerk/shared": 4.31.0
  "@effect/atom-react": 4.0.0-beta.107
  "@effect/openapi-generator": 4.0.0-beta.107
  "@effect/platform-bun": 4.0.0-beta.107
  "@effect/platform-node": 4.0.0-beta.107
  "@effect/platform-node-shared": 4.0.0-beta.107
  "@effect/sql-pg": 4.0.0-beta.107
  "@effect/sql-sqlite-bun": 4.0.0-beta.107
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.0-beta.107
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@pierre/diffs": 1.4.1
  "@types/node": 24.13.3
  "@typescript/native": npm:typescript@7.0.2
  effect: 4.0.0-beta.107
  jose: 6.2.12
  typescript: npm:@typescript/typescript6@6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  yaml: ^2.9.0

# keep explicit updates within the release-age policy
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@clerk/clerk-js@6.25.7"
  - "@clerk/expo@4.0.2"
  - "@clerk/shared@4.25.7"
  - "@expo/cli@57.0.20"
  - "@expo/env@2.4.3"
  - "@expo/fingerprint@0.20.11"
  - "@expo/metro-config@57.0.12"
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo-updates@57.0.19
  - expo@57.0.18
  - expo-widgets@57.0.15

overrides:
  "@clerk/clerk-js": "catalog:"
  "@clerk/clerk-js>@base-org/account": "-"
  "@clerk/clerk-js>@coinbase/wallet-sdk": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-base": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-react": "-"
  "@clerk/clerk-js>@solana/wallet-standard": "-"
  "@clerk/clerk-js>@wallet-standard/core": "-"
  "@clerk/expo": "catalog:"
  "@clerk/shared": "catalog:"
  "@effect/atom-react": "catalog:"
  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-sqlite-bun": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@expo/dom-webview": 57.0.1
  "@expo/metro-config": 57.0.12
  expo-constants: 57.0.17
  "@pierre/diffs>@shikijs/transformers": ^4.4.3
  "@types/node": "catalog:"
  effect: "catalog:"
  expo-router: 57.0.19
  "expo-sharing>@expo/config-plugins": 57.0.9
  "expo-sharing>@expo/config-types": 57.0.2
  vite: "catalog:"
  yaml: "catalog:"
  "@pierre/trees@1.0.0-beta.6>@pierre/theming": 1.0.1

packageExtensions:
  "@clerk/expo@*":
    dependencies:
      "@expo/config-plugins": 57.0.9
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"
  react-native-nitro-markdown@0.12.1:
    peerDependenciesMeta:
      ratex-react-native:
        optional: true

patchedDependencies:
  "@effect/vitest@4.0.0-beta.107": patches/@effect__vitest@4.0.0-beta.107.patch
  "@expo/metro-config@57.0.12": patches/@expo__metro-config@57.0.12.patch
  "@ff-labs/fff-node@0.10.6": patches/@ff-labs__fff-node@0.10.6.patch
  "@react-native-menu/menu@2.0.0": patches/@react-native-menu__menu@2.0.0.patch
  effect@4.0.0-beta.107: patches/effect@4.0.0-beta.107.patch
  react-native-gesture-handler@2.32.0: patches/react-native-gesture-handler@2.32.0.patch
  react-native-keyboard-controller@1.21.13: patches/react-native-keyboard-controller@1.21.13.patch
  react-native-screens@4.26.2: patches/react-native-screens@4.26.2.patch
  "@legendapp/list@3.3.10": patches/@legendapp__list@3.3.10.patch
  "@pierre/diffs@1.4.1": patches/@pierre%2Fdiffs@1.4.1.patch
  react-native-nitro-modules@0.37.1: patches/react-native-nitro-modules@0.37.1.patch
  "@react-navigation/native-stack@7.18.10": patches/@react-navigation%2Fnative-stack@7.18.10.patch

# utf-8-validate is an optional peer of the old ws@7 that react-devtools-core drags in,
# & allowBuilds keeps it unbuilt anyway; typescript is deliberately the TS 6 preview alias,
# which no expo package declares support for yet.
peerDependencyRules:
  allowAny:
    - vite
    - utf-8-validate
    - typescript
  allowedVersions:
    # expo 57's react-native 0.86.3 renderer requires react 19.2.3; these atom hooks use supported APIs
    "@effect/atom-react@4.0.0-beta.107>react": "19.2.3"
    vite: "*"
    utf-8-validate: "*"
    typescript: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
